version: "3.9"

services:
  # Credentials come from classroom/.env (a symlink to api/.env on the server).
  # The defaults below are only for a throwaway local database.
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-classroom}
      POSTGRES_USER: ${DB_USER:-heystat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-heystat}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-heystat} -d ${DB_NAME:-classroom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./api
      dockerfile: ../Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./api/.env
    volumes:
      - uploads:/uploads
      - /root/Documents:/root/Documents:ro   # Jamovi data root (read-only for safety)
    ports:
      - "8080:8080"
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8080 --workers 2"

  worker:
    build:
      context: ./api
      dockerfile: ../Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - db
    env_file:
      - ./api/.env
    volumes:
      - uploads:/uploads
    command: celery -A tasks.celery_app worker --loglevel=info -Q default

  scheduler:
    build:
      context: ./api
      dockerfile: ../Dockerfile
    restart: unless-stopped
    depends_on:
      - redis
      - db
    env_file:
      - ./api/.env
    volumes:
      - uploads:/uploads
    command: celery -A tasks.celery_app beat --loglevel=info

volumes:
  pg_data:
  redis_data:
  uploads:
