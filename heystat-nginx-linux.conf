# HeyStat on LXC (heystat.pedu.vn) — nginx site config
#
# Four kinds of traffic, in order of how public they are:
#   /            home page (Guest)          static, no session
#   /help        user guide (Guest)         static, no session
#   /classroom/  LMS SPA + its own router guard (login/register must stay open)
#   /app, /…     jamovi session paths       auth_request: a Guest is bounced to the login page
#
# Public pages ship with the SPA build (frontend/public/site → dist/site →
# /var/www/classroom/site) so classroom/deploy-frontend.sh installs both.

# Map for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name heystat.pedu.vn;

    access_log /var/log/nginx/heystat_access.log;
    error_log /var/log/nginx/heystat_error.log warn;

    # ── Public pages: no account needed ───────────────────────────
    location = / {
        root /var/www/classroom;
        try_files /site/home.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    location = /help {
        root /var/www/classroom;
        try_files /site/help.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # ── Classroom API (FastAPI) ───────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers on;
    }

    # Internal auth subrequest used by the Jamovi gate below.
    # /auth/check also accepts ?session= (see X-Original-URI), which is how an
    # iframe the LMS just opened gets through before its own cookie is set.
    location = /_auth_check {
        internal;
        proxy_pass http://127.0.0.1:8080/api/v1/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-Proto https;
    }

    # A rejected gate sends the visitor to the login page instead of a bare 401.
    # /classroom/ is deliberately not gated below, or this redirect would loop.
    location @login_required {
        return 302 /classroom/login;
    }

    # ── Classroom SPA (Vue 3) ─────────────────────────────────────
    # The app decides what needs a session: login and register must stay
    # reachable for a Guest, so this block is not gated.
    location /classroom {
        root /var/www;
        try_files $uri $uri/ /classroom/index.html;

        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # Never cache index.html so browsers always pick up new JS hashes after deploy
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # CSP: allow iframe embed only from whitelisted sources (Phase 11 – Lessons)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-src 'self' https://heystat.pedu.vn https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com https://docs.google.com https://loom.com https://www.loom.com https://player.vimeo.com https://onedrive.live.com https://1drv.ms; connect-src 'self' wss://heystat.pedu.vn https://cloudflareinsights.com;";

        # toolbar.js must never be cached (it changes frequently)
        location = /classroom/heystat-toolbar.js {
            root /var/www;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        location ~* \.(js|css|png|jpg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Jamovi ────────────────────────────────────────────────────
    # Everything except the pages above is jamovi: /{instance_id}/…, /open,
    # /dl/, /assets, /i18n and the websockets. Those instance paths stay at the
    # root because jamovi builds them itself, so the catch-all is the session.
    #
    # /app is the signed-in entry point: the trailing slash in proxy_pass maps
    # /app onto jamovi's root, which answers with a 302 to
    # /{instance_id}/…?session=… — a URL the gate recognises (see _auth_check).
    location = /app {
        auth_request /_auth_check;
        error_page 401 = @login_required;

        # Simple proxy to the HeyStat container
        proxy_pass http://127.0.0.1:42337/;

        # Timeouts for long-running connections
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # CRITICAL: Host header MUST match JAMOVI_HOST_A for multi-origin security
        proxy_set_header Host heystat.pedu.vn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto must be https (Cloudflare terminates SSL)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host heystat.pedu.vn;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward WebSocket headers
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # Origin from client
        proxy_set_header Origin $http_origin;

        # Forward cookies
        proxy_set_header Cookie $http_cookie;

        # Disable ALL buffering for WebSocket
        proxy_buffering off;
        proxy_cache off;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;

        # Inject the Classroom toolbar into jamovi's HTML. Accept-Encoding is
        # cleared so the upstream sends plain HTML that sub_filter can rewrite.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</body>' '<script src="/classroom/heystat-toolbar.js?v=9"></script></body>';

        # Reduce latency
        tcp_nodelay on;
        keepalive_timeout 65;
    }

    location / {
        auth_request /_auth_check;
        error_page 401 = @login_required;

        # Simple proxy to HeyStat container
        proxy_pass http://127.0.0.1:42337;

        # Timeouts for long-running connections
        proxy_read_timeout 86400;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # CRITICAL: Host header MUST match JAMOVI_HOST_A for multi-origin security
        proxy_set_header Host heystat.pedu.vn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto must be https (Cloudflare terminates SSL)
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host heystat.pedu.vn;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward WebSocket headers
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # Origin from client
        proxy_set_header Origin $http_origin;

        # Forward cookies
        proxy_set_header Cookie $http_cookie;

        # Disable ALL buffering for WebSocket
        proxy_buffering off;
        proxy_cache off;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache 1;

        # Inject the Classroom toolbar into jamovi's HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</body>' '<script src="/classroom/heystat-toolbar.js?v=9"></script></body>';

        # Reduce latency
        tcp_nodelay on;
        keepalive_timeout 65;
    }
}
